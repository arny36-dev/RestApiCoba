# Alembic configuration — prepared, but no migrations have been generated yet.
#
# The real database schema is not known to this project (tables are reflected
# at runtime), so do NOT autogenerate migrations blindly. When the schema is
# available, initialize the environment with:
#
#   alembic init migrations
#
# and wire migrations/env.py to read DATABASE_URL from the environment.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Intentionally empty — configure migrations/env.py to read DATABASE_URL
# from the environment instead of hardcoding credentials here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
